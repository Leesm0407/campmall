<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 노지마켓 디자인 파일 (Dreamweaver CS6용). 실제로 동작하는 사이트는 상위 폴더의 .jsp 파일입니다. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 노지마켓</title>
<link rel="icon" type="image/png" href="images/logo-mark.png">
<link rel="stylesheet" href="css/design.css">
</head>
<body>
<header class="site-header">
	<div class="header-inner">
		<a href="index.html" class="logo" aria-label="노지마켓 처음 화면">
			<img src="images/logo-mark.png" alt="" width="44" height="44">
			<span class="logo-text"><b>노지마켓</b><small>NOJI MARKET</small></span>
		</a>
		<nav class="main-nav" aria-label="주 메뉴">
			<a href="productList_tent.html" class="">텐트·타프</a>
			<a href="productList.html" class="">침낭·매트</a>
			<a href="productList.html" class="">캠핑 가구</a>
			<a href="productList.html" class="">버너·조리</a>
			<a href="productList.html" class="">랜턴·조명</a>
			<a href="myOrder.html" class="">주문 내역</a>
		</nav>
		<div class="header-actions">
			<a href="cart.html" class="btn btn-gray cart-link">장바구니 <span class="cart-count">0</span></a>
					<a href="loginForm.html" class="btn btn-outline">로그인</a>
					<a href="registerForm.html" class="btn btn-forest">회원가입</a>
		</div>
	</div>
</header>
<main class="auth-wrap">
	<form class="auth-card" name="form1" method="post" action="index.html">
		<input type="hidden" name="returnUrl" value="">
		<div class="auth-title">
			<h1>로그인</h1>
			<p>주문하려면 로그인해 주세요.</p>
		</div>
		<div class="field">
			<label for="idfield">아이디</label>
			<input type="text" name="userId" id="idfield" class="input" autocomplete="username">
		</div>
		<div class="field">
			<label for="pwfield">비밀번호</label>
			<input type="password" name="password" id="pwfield" class="input" autocomplete="current-password">
		</div>
		<button type="submit" class="btn btn-forest btn-lg btn-block">로그인</button>
		<p class="auth-foot">아직 회원이 아니세요? <a href="registerForm.html">회원가입</a></p>
		<p class="auth-note">관리자 계정으로 로그인하면 관리자 화면으로 이동해요.</p>
	</form>
</main>
<footer class="site-footer">
	<div class="footer-inner">
		<span class="footer-brand">노지마켓 NOJI MARKET</span>
		<span>고객센터 02-000-0000 · 평일 10:00~18:00 · 5만 원 이상 무료배송</span>
		<span>웹프로그래밍응용 텀프로젝트 · 상품명·브랜드·사진은 모두 가상의 예시</span>
	</div>
</footer>
</body>
</html>
